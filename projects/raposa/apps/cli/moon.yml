id: 'raposa-cli'
language: 'go'
layer: 'application'
tasks:
  build:
    command: 'go build ./...'
    toolchain: 'system'
  test:
    script: 'go test -race -count=1 ./...'
    toolchain: 'system'
    options:
      cache: false
  fmt:
    script: 'files=$(gofmt -l .); if [ -n "$files" ]; then printf "%s\n" "$files"; exit 1; fi'
    toolchain: 'system'
  lint:
    command: 'go vet ./...'
    toolchain: 'system'
    deps: ['~:fmt']

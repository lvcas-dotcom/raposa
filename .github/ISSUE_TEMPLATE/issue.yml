name: Issue
description: Trabalho rastreável no board, seguindo docs/processo/workflow.md.
body:
  - type: dropdown
    id: tipo
    attributes:
      label: Tipo
      description: Define o label type:* e o prefixo da branch. Um mantenedor aplica o label na triagem.
      options:
        - feature (feat/)
        - melhoria (feat/)
        - bug (fix/)
        - chore (chore/)
        - tech-debt (chore/)
        - spike (spike/)
    validations:
      required: true
  - type: textarea
    id: contexto
    attributes:
      label: Contexto
      description: Problema atual, por que importa e o que limita hoje.
    validations:
      required: true
  - type: textarea
    id: o-que-fazer
    attributes:
      label: O que fazer
      description: Entregas esperadas, em itens.
    validations:
      required: true
  - type: textarea
    id: fora-de-escopo
    attributes:
      label: Fora de escopo
      description: O que não entra nesta issue.
    validations:
      required: true
  - type: textarea
    id: aceite
    attributes:
      label: Critério de aceite
      description: Condições verificáveis, com comando ou cenário.
    validations:
      required: true
  - type: textarea
    id: referencias
    attributes:
      label: Referências
      description: Arquivos do repositório, ADRs e fontes públicas.
